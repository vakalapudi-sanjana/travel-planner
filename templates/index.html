<!DOCTYPE html>
<html>

<head>

    <title>AI Travel Planner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #f7f7ff);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f5f5f5;
            border-radius: 12px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>✈️ AI Travel Planner</h1>

    <p class="subtitle">
        Plan your perfect trip with AI
    </p>


    <form method="POST">

        <label>🌍 Destination</label>

        <input
            type="text"
            name="destination"
            placeholder="Example: Goa"
            required
        >


        <label>📅 Number of Days</label>

        <input
            type="number"
            name="days"
            placeholder="Example: 3"
            min="1"
            required
        >


        <label>💰 Budget</label>

        <input
            type="text"
            name="budget"
            placeholder="Example: ₹15,000"
            required
        >


        <label>❤️ Interests</label>

        <input
            type="text"
            name="interests"
            placeholder="Example: beaches, food, sightseeing"
            required
        >


        <button type="submit">
            ✨ Generate Travel Plan
        </button>

    </form>


    {% if result %}

    <div class="result">

        <h2>🌴 Your Travel Plan</h2>

        {{ result }}

    </div>

    {% endif %}

</div>

</body>

</html>
